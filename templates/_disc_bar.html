<div class="disc-bar" role="img" aria-label="{% for part in bar %}{{ part.color }} {{ part.percent }}%{% if not loop.last %}, {% endif %}{% endfor %}">
    {% for part in bar %}{% if part.percent > 0 %}<div style="width: {{ part.percent }}%; background: {{ part.hex }};" title="{{ part.color }} {{ part.percent }}%"></div>{% endif %}{% endfor %}
</div>
<div class="disc-legend">
    {% for part in bar %}<span><i style="background: {{ part.hex }};"></i>{{ part.color }} {{ part.percent }}%</span>{% endfor %}
</div>
