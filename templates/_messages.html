{% set alert_types = {"success": "success", "error": "danger", "info": "info"} %}
{% for message_type, message in get_flashed_messages(with_categories=true) %}
<div class="alert alert-{{ alert_types.get(message_type, 'info') }} alert-dismissible fade show" role="alert">
    {{ message }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
{% endfor %}
